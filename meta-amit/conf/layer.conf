# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-amit"
BBFILE_PATTERN_meta-amit = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-amit = "6"

LAYERDEPENDS_meta-amit = "core"
LAYERSERIES_COMPAT_meta-amit = "kirkstone"
